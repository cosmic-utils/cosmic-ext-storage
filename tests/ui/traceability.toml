# Machine-readable traceability source. ui-plan-check expands one row per method
# from contract-surface-v1.toml; this file intentionally never repeats method IDs.
schema_version = 1
contract_inventory = "docs/plans/4-testing/contract-surface-v1.toml"
workflow_v2_cross_cutting_tests = [
  "workflow_harness_uses_only_selected_scenario_runtime",
  "workflow_effects_do_not_call_global_operations_context"
]

[[generated_contract_rows]]
families = [
  "BackendMetadata", "DiskDiscovery", "DeviceEventSource", "DriveOperations",
  "PartitionOperations", "FilesystemOperations", "EncryptionOperations",
  "ImageDeviceOperations (temporary native-only bridge)", "BtrfsOperations",
  "LogicalTopologySource", "LogicalOperations", "NetworkDriveBackend",
  "FilesystemToolDiscovery", "UsageOperations", "ImageWorkflowOperations",
  "DesktopServices"
]
ui_entry_point = "none unless a flow below names it"
state_dto = "derived from inventory state column"
configured_error = "StorageError selected by behaviour rule"
transition = "inventory default or typed StateTransition"
fixture = "tests/ui/scenarios/empty.toml"
in_process_test = "generated_cases_cover_success_error_trace_and_transition_for_every_modelled_operation"
e2e_case = "none"
runtime_field = "AppRuntime.operations or AppRuntime.desktop"

[[flow]]
id = "physical_partition_format"
ui_entry_point = "LoadDrivesIncremental; partition create/format dialog"
operations = ["discovery.list_disks", "discovery.list_volumes", "partition.create_partition", "filesystem.format"]
fixture = "tests/ui/scenarios/physical/partition-format.toml"
branches = ["open", "validation", "cancel", "success", "configured_error", "refresh"]
in_process_test = "physical_scenario_drives_dialog_and_refresh"
e2e_case = "physical_partition_format"
runtime_field = "AppRuntime.operations"
application_workflow_tests = [
  "update::production_handler_tests::create_routes_to_selected_runtime_and_refreshes_actual_models",
  "update::production_handler_tests::create_cancel_and_missing_dialog_have_no_effect::case_1_cancel",
  "update::production_handler_tests::create_cancel_and_missing_dialog_have_no_effect::case_2_no_dialog",
  "update::production_handler_tests::create_submission_revalidates_form_without_side_effects::case_1_zero_size",
  "update::production_handler_tests::create_submission_revalidates_form_without_side_effects::case_2_oversized",
  "update::production_handler_tests::create_submission_revalidates_form_without_side_effects::case_3_missing_tool",
  "update::production_handler_tests::create_submission_revalidates_form_without_side_effects::case_4_missing_secret",
  "update::production_handler_tests::create_submission_revalidates_form_without_side_effects::case_5_mismatched_secret",
  "update::production_handler_tests::create_failure_surfaces_error_without_refreshing_navigation",
  "update::production_handler_tests::format_uses_selected_runtime_and_handles_invalid_targets::case_1_success",
  "update::production_handler_tests::format_uses_selected_runtime_and_handles_invalid_targets::case_2_missing_device",
  "update::production_handler_tests::format_uses_selected_runtime_and_handles_invalid_targets::case_3_missing_tool",
  "update::production_handler_tests::create_completion_does_not_close_a_replacement_idle_dialog",
  "update::production_handler_tests::old_partition_completion_cannot_replace_a_new_running_dialog::case_1_success",
  "update::production_handler_tests::old_partition_completion_cannot_replace_a_new_running_dialog::case_2_failure"
]

[[flow]]
id = "busy_unmount"
ui_entry_point = "volume unmount and blocking-process dialog"
operations = ["filesystem.unmount", "filesystem.get_mount_point", "filesystem.blocking_processes", "filesystem.kill_processes"]
fixture = "tests/ui/scenarios/physical/busy-unmount.toml"
branches = ["open", "busy_error", "cancel", "retry", "refresh"]
in_process_test = "configured_backend_error_remains_actionable"
e2e_case = "busy_unmount"
runtime_field = "AppRuntime.operations"
application_workflow_tests = [
  "update::production_handler_tests::mount::busy_result_routes_to_dialog_and_retry_preserves_mounted_state::case_1_segment",
  "update::production_handler_tests::mount::busy_result_routes_to_dialog_and_retry_preserves_mounted_state::case_2_child",
  "update::production_handler_tests::mount::busy_result_routes_to_dialog_and_retry_preserves_mounted_state::case_3_sidebar",
  "update::production_handler_tests::mount::unsupported_kill_is_an_error_not_a_fake_unmount_success",
  "update::production_handler_tests::mount::child_mount_and_unmount_refresh_real_state"
]

[[flow]]
id = "luks_unlock"
ui_entry_point = "encryption unlock dialog"
operations = ["encryption.list_luks_devices", "encryption.unlock_luks"]
fixture = "tests/ui/scenarios/physical/luks.toml"
branches = ["open", "validation", "configured_error", "success", "refresh"]
in_process_test = "configured_backend_error_remains_actionable"
e2e_case = "luks_unlock"
runtime_field = "AppRuntime.operations"
application_workflow_tests = [
  "update::production_handler_tests::encryption::wrong_secret_retries_successfully_then_locks_actual_model",
  "update::production_handler_tests::encryption::cancelled_or_missing_target_never_unlocks::case_1_cancel",
  "update::production_handler_tests::encryption::cancelled_or_missing_target_never_unlocks::case_2_missing_partition",
  "update::production_handler_tests::encryption::cancelled_unlock_failure_cannot_reopen_a_secret_dialog"
]

[[flow]]
id = "logical_preflight_confirmation"
ui_entry_point = "logical picker, preflight, confirmation, refresh"
operations = ["logical.list_entities", "logical.capture_candidate", "logical.preflight", "logical.execute", "discovery.device_events"]
fixture = "tests/ui/scenarios/logical/preflight.toml"
branches = ["open", "blocked", "stale", "cancel", "success", "refresh"]
in_process_test = "physical_scenario_drives_dialog_and_refresh"
e2e_case = "logical_preflight_confirmation"
runtime_field = "AppRuntime.operations"
application_workflow_tests = [
  "update::production_handler_tests::logical::confirmation_executes_once_and_schedules_both_real_refreshes",
  "update::production_handler_tests::logical::cancelled_confirmation_and_changed_identity_cannot_execute",
  "update::production_handler_tests::logical::cancelled_preflight_cannot_reopen_confirmation",
  "update::production_handler_tests::logical::stale_candidate_capture_cannot_change_current_selection::case_1_replaced",
  "update::production_handler_tests::logical::stale_candidate_capture_cannot_change_current_selection::case_2_left_view",
  "update::production_handler_tests::logical::stale_topology_does_not_replace_current_candidate_resolution",
  "update::production_handler_tests::logical::operation_failure_clears_pending_without_success_refresh",
  "update::production_handler_tests::logical::action_form_validates_input_and_cancel_clears_actual_dialog"
]

[[flow]]
id = "network_mount"
ui_entry_point = "network remote create/test/mount form"
operations = ["network.configuration_schema", "network.create_config", "network.test_config", "network.mount", "network.mount_status"]
fixture = "tests/ui/scenarios/network/mount.toml"
branches = ["open", "validation", "configured_error", "success", "refresh"]
in_process_test = "network_scenario_exercises_crud_and_mount_state"
e2e_case = "network_mount"
runtime_field = "AppRuntime.operations"
application_workflow_tests = ["network_create_mount_and_status_are_reduced_from_one_flow"]

[[flow]]
id = "image_usage_progress"
ui_entry_point = "image and usage progress dialogs"
operations = ["desktop.select_image", "image.start_copy", "image.copy_status", "image.cancel_copy", "usage.start_scan", "usage.scan_status", "usage.delete_files"]
fixture = "tests/ui/scenarios/workflows/image-usage.toml"
branches = ["open", "pending", "advance_clock", "progress", "cancel", "completion", "configured_error"]
in_process_test = "usage_and_image_progress_render_from_contract_events"
e2e_case = "image_usage_progress"
runtime_field = "AppRuntime.operations,AppRuntime.desktop"
application_workflow_tests = [
  "image_progress_cancel_and_terminal_state_are_virtual_clock_driven",
  "image_usage_stale_completion_cannot_replace_newer_workflow_state",
  "usage_scan_and_delete_map_results_without_host_file_access"
]

[[flow]]
id = "keyboard_accessibility"
ui_entry_point = "all test-case dialogs using keyboard navigation"
operations = []
fixture = "tests/ui/scenarios/accessibility/keyboard.toml"
branches = ["focus", "disabled_reason", "cancel", "submit"]
in_process_test = "keyboard_dialog_flow_has_named_controls"
e2e_case = "keyboard_accessibility"
runtime_field = "AppRuntime"

[[flow]]
id = "live_scenario_reload"
ui_entry_point = "scenario diagnostic state and subscribed pages"
operations = ["discovery.device_events"]
fixture = "tests/ui/scenarios/reload/live.toml"
branches = ["atomic_replace", "semantic_reload", "valid_reload", "invalid_reload", "in_flight_cancel", "refresh_once"]
in_process_test = "scenario_reload_is_atomic_and_refreshes_once"
e2e_case = "live_scenario_reload"
runtime_field = "AppRuntime.scenario_control,AppRuntime.operations"
application_workflow_tests = [
  "scenario_reload_is_atomic_and_generation_checked_by_the_application",
  "reload_stale_completion_cannot_move_virtual_time_backwards"
]
