[package]
name = "ui-e2e-runner"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "ui-e2e-runner"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
libc.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
base64.workspace = true
futures-util.workspace = true
tokio.workspace = true
toml.workspace = true
zbus.workspace = true
atspi = { version = "=0.29.0", default-features = false, features = ["connection", "proxies", "tokio"] }
tempfile = "=3.27.0"

[dev-dependencies]
rstest.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(storage_ui_coverage)'] }
