name: CI

on:
  workflow_dispatch:
    inputs:
      ui_e2e:
        description: 'Opt in to rendered UI diagnostics (upstream blockers remain)'
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  UI_E2E_ENABLED: ${{ inputs.ui_e2e && '1' || '0' }}

jobs:
  build:
    name: Rust tests on ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup update
      - run: rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-${{ runner.os }}

      - name: install system deps
        run: sudo apt install libxkbcommon-dev libbtrfsutil-dev

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Check test execution and coverage contracts
        run: python3 -m unittest discover -s tools/testing -p 'test_*.py'

  clippy:
    name: Clippy on ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup update
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-${{ runner.os }}
          save-if: false

      - name: install system deps
        run: sudo apt install libxkbcommon-dev libbtrfsutil-dev

      - name: Run clippy
        run: cargo clippy --workspace --all-features --locked

  fmt:
    name: Rustfmt
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update
      - run: rustup component add rustfmt

      - name: Run rustfmt
        run: cargo fmt --all --check --verbose

  ui-scenario-contract:
    name: UI scenario contract
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: rustup component add rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y just libxkbcommon-dev libbtrfsutil-dev
      - run: python3 tools/ui-testing/assert_tests.py --phase all
      - run: just ui-scenario-check
      - run: cargo test -p cosmic-ext-storage --locked --test scenario_feature_disabled_contract
      - run: cargo test -p cosmic-ext-storage --features test-backend --locked --test ui_scenario_contract

  application-workflow-integration:
    name: Application workflow integration
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y just libxkbcommon-dev libbtrfsutil-dev
      - run: just ui-plan-check
      - run: just app-workflow-check
      - run: cargo test -p test-backend --locked
      - run: cargo test -p cosmic-ext-storage --features test-backend --locked --test ui_scenario_contract

  storage-lab:
    name: Storage lab
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Includes the cold root-application build for real registry/image cases.
    # Each native lab case retains Nextest's separate five-minute hard limit.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup update
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: storage-lab-${{ runner.os }}
      - uses: taiki-e/install-action@nextest
      - run: sudo apt-get update && sudo apt-get install -y just libbtrfsutil-dev libclang-dev
      - name: Build and run private storage lab
        env:
          STORAGE_LAB: "1"
        run: just test-lab
      - name: Upload storage lab evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-lab-artifacts
          path: |
            target/storage-lab-artifacts
            target/nextest/storage-lab/junit.xml
          if-no-files-found: warn

  coverage:
    name: Non-rendered coverage
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage-${{ runner.os }}
          workspaces: '. -> target/coverage/host-build'
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: sudo apt-get update && sudo apt-get install -y just libxkbcommon-dev libbtrfsutil-dev libclang-dev
      - name: Collect host and private native-lab coverage
        env:
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: just coverage "$COVERAGE_BASE" non-rendered
      - name: Upload coverage evidence even when thresholds fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: non-rendered-coverage
          path: |
            target/coverage/non-rendered/acceptance.json
            target/coverage/non-rendered/evidence.json
            target/coverage/non-rendered/summary.json
            target/coverage/non-rendered/lcov.info
            target/coverage/non-rendered/html
            target/coverage/non-rendered/run-*/*.log
            target/coverage/non-rendered/run-*/execution-policy.json
            target/nextest/storage-lab/junit.xml
          if-no-files-found: warn

  ui-e2e:
    name: UI E2E capability
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record deferred rendered UI
        if: env.UI_E2E_ENABLED == '0'
        run: echo 'Rendered UI is deferred by policy. No capability probe or UI cases were executed.' >> "$GITHUB_STEP_SUMMARY"
      - if: env.UI_E2E_ENABLED == '1'
        run: sudo apt-get update && sudo apt-get install -y just
      - if: env.UI_E2E_ENABLED == '1'
        run: just ui-e2e
      - name: Execute reload regression with separate shutdown evidence
        if: env.UI_E2E_ENABLED == '1'
        run: bash tools/ui-testing/run-case.sh tests/ui/cases/live_scenario_reload.toml
      - name: Upload UI evidence
        if: always() && env.UI_E2E_ENABLED == '1'
        uses: actions/upload-artifact@v4
        with:
          name: ui-artifacts
          path: ui-artifacts
          if-no-files-found: warn
