name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Rust tests on ${{ matrix.os }}
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup update
      - run: rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-${{ runner.os }}

      - name: install system deps
        run: sudo apt install libxkbcommon-dev libbtrfsutil-dev

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Run required safe harness profile
        run: |
          cargo install just --locked
          just harness-nondestructive

  clippy:
    name: Clippy on ${{ matrix.os }}
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup update
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-${{ runner.os }}
          save-if: false

      - name: install system deps
        run: sudo apt install libxkbcommon-dev libbtrfsutil-dev

      - name: Run clippy
        run: cargo clippy --workspace --all-features --locked

  fmt:
    name: Rustfmt
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update
      - run: rustup component add rustfmt

      - name: Run rustfmt
        run: cargo fmt --all --check --verbose

  ui-scenario-contract:
    name: UI scenario contract
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: rustup component add rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y just libxkbcommon-dev libbtrfsutil-dev
      - run: python3 tools/ui-testing/assert_tests.py --phase all
      - run: just ui-scenario-check
      - run: cargo test -p cosmic-ext-storage --locked --test scenario_feature_disabled_contract
      - run: cargo test -p cosmic-ext-storage --features test-backend --locked --test ui_scenario_contract

  application-workflow-integration:
    name: Application workflow integration
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y just libxkbcommon-dev libbtrfsutil-dev
      - run: just ui-plan-check
      - run: just app-workflow-check
      - run: cargo test -p test-backend --locked
      - run: cargo test -p cosmic-ext-storage --features test-backend --locked --test ui_scenario_contract

  ui-e2e:
    name: UI E2E capability
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y just
      - run: just ui-e2e
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-artifacts
          path: ui-artifacts
          if-no-files-found: warn
