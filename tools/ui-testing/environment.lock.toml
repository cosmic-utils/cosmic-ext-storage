apt_snapshot = "https://snapshot.debian.org/archive/debian/20250701T000000Z/"
packages = [
  { name = "at-spi2-core", version = "2.46.0-5" },
  { name = "dbus", version = "1.14.10-1~deb12u1" },
  { name = "fonts-dejavu-core", version = "2.37-6" },
  { name = "foot", version = "1.13.1-2+deb12u1" },
  { name = "grim", version = "1.4.0+ds-2" },
  { name = "libbtrfsutil-dev", version = "6.2-1+deb12u1" },
  { name = "libclang-dev", version = "1:14.0-55.7~deb12u1" },
  { name = "libxkbcommon-dev", version = "1.5.0-1" },
  { name = "libvulkan1", version = "1.3.239.0-1" },
  { name = "mesa-vulkan-drivers", version = "22.3.6-1+deb12u1" },
  { name = "pkg-config", version = "1.8.1-1" },
  { name = "sway", version = "1.7-6" },
  { name = "wtype", version = "0.4-3" },
]
fonts = [{ path = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", sha256 = "abdc775b21b1bc470d50c97e790d276f2054b7504e56e5bd3e64f48d68582322" }]
sway_command = ["sway", "--unsupported-gpu", "--config", "/workspace/tools/ui-testing/sway.conf"]
dbus_command = ["dbus-run-session", "--"]
renderer_env = { EGL_PLATFORM = "wayland", LIBGL_ALWAYS_SOFTWARE = "1", WGPU_BACKEND = "vulkan", WLR_BACKENDS = "headless", WLR_LIBINPUT_NO_DEVICES = "1", WLR_RENDERER = "pixman", LIBSEAT_BACKEND = "noop" }
home = "<artifact-root>/home"
